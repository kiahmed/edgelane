# EdgeLane backend — local-container production stack.
#
#   edgelane-backend   FastAPI app + Torque page (port 8789, internal)
#   edgelane-cloudflared  Cloudflare tunnel exposing the backend over HTTPS
#
# The tunnel routes a public hostname (e.g. edgelane-api.<your-domain>) to
# http://edgelane-backend:8789 across the compose network — so nothing needs
# to be published to the host's public interface.
#
# Run from the repo root via `make deploy-be` (which calls deploy.sh), or
# directly:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Secrets/config:
#   - deploy/.env            tunnel token + image/port knobs   (git-ignored)
#   - edgelane_market.config Tradier tokens, symbols, DB path  (git-ignored)
#                            bind-mounted read-only at /config/

name: edgelane

services:
  edgelane-backend:
    build:
      context: ../market/backend
      dockerfile: Dockerfile
    image: ${EDGELANE_IMAGE:-edgelane-backend:latest}
    container_name: edgelane-backend
    restart: unless-stopped
    # Optional: expose on the host loopback for local curl/debugging. The
    # tunnel does NOT need this — it reaches the app over the compose network.
    ports:
      - "127.0.0.1:${EDGELANE_PORT:-8789}:8789"
    environment:
      EDGELANE_MARKET_CONFIG: /config/edgelane_market.config
    volumes:
      # Live config (Tradier tokens, DEVMODE, symbols) — read-only.
      - ../edgelane_market.config:/config/edgelane_market.config:ro
      # Persist the DuckDB store across container recreates (DB_PATH defaults
      # to ~/.edgelane/market.duckdb → /root/.edgelane inside the container).
      - edgelane-data:/root/.edgelane
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8789/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edgelane-network

  # Free Cloudflare *quick* tunnel (no domain, no token). On each start it
  # publishes the freshly-assigned *.trycloudflare.com URL to Supabase
  # (app_config.api_base) so the Vercel frontend discovers it at runtime — no
  # redeploy when the URL rotates on restart. To switch to a STABLE named tunnel
  # later (after you own a domain): set CF_TUNNEL_TOKEN and replace this service
  # with `image: cloudflare/cloudflared:latest` +
  # `command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}`.
  edgelane-cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    image: edgelane-cloudflared:latest
    container_name: edgelane-cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TARGET: http://edgelane-backend:8789
      # Force HTTP/2 (TCP 443) instead of QUIC (UDP 7844). The QUIC datagram
      # path to Cloudflare's edge degrades intermittently on this host (WSL2
      # NAT), and cloudflared can get stuck retrying QUIC instead of falling
      # back — surfacing as endless "control stream encountered a failure" /
      # "datagram handler: context canceled" loops. TCP is stable here.
      TUNNEL_TRANSPORT_PROTOCOL: http2
      # service_role write to app_config (the URL pointer). Server-only secret.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    depends_on:
      edgelane-backend:
        condition: service_started
    networks:
      - edgelane-network

volumes:
  edgelane-data:
    external: false

networks:
  edgelane-network:
    external: false
