<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Matrix">
  <rect width="64" height="64" rx="14" fill="#0a0f1a"/>
  <!-- outer M — mirrors the Matrix logomark's square-shouldered chevron -->
  <path d="M16 49V16l16 20 16-20v33"
        fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- nested chevron + circuit nodes, the mark's neon layer -->
  <path d="M23 31l9 11 9-11" fill="none" stroke="#3ddc97" stroke-width="3"
        stroke-linejoin="miter" stroke-linecap="square"/>
  <rect x="29.5" y="12.5" width="5" height="5" fill="#3ddc97"/>
  <rect x="29.5" y="45" width="5" height="5" fill="#22b8e0"/>
</svg>
