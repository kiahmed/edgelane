<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TORQUE · fast order builder</title>
<link rel="icon" type="image/svg+xml" href="/torque/assets/favicon.svg" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111721; --panel2:#0d131c; --line:#1d2733; --line2:#2a3744;
    --txt:#d6e0ea; --dim:#aab7c5; --dim2:#8d9bab;
    --call:#36d399; --put:#f87272; --debit:#fbbf24; --credit:#36d399;
    --accent:#4aa3ff; --accentdim:#1a3a5c; --warn:#fbbf24; --bad:#f87272; --good:#36d399;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 var(--mono);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  /* SPA: fill the viewport, center horizontally, never scroll the page —
     the orders panel takes the remaining height and scrolls internally. */
  .wrap{max-width:1320px;margin:0 auto;padding:12px 16px;height:100vh;
    box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
  .grid{flex:0 0 auto}
  .panel.orders{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column}
  .panel.orders .oscroll{flex:1 1 auto;min-height:0;overflow-y:auto;margin-top:6px}
  /* Phones/tablets (touch-primary) or narrow windows: unlock page scroll so the
     full builder + orders can never clip. Laptops/desktops stay locked scrollless. */
  @media (hover:none) and (pointer:coarse), (max-width:980px){
    html,body{height:auto;overflow:auto}
    .wrap{height:auto;min-height:100vh;overflow:visible}
    .panel.orders{min-height:220px}
    .panel.orders .oscroll{overflow-y:visible}
  }
  header{display:flex;align-items:center;gap:14px;padding:6px 2px 16px;border-bottom:1px solid var(--line)}
  .logomark{width:38px;height:38px;display:block}
  .brand{display:flex;flex-direction:column;line-height:1}
  .logo{font-weight:800;letter-spacing:3px;font-size:20px;color:#fff}
  .logo small{color:var(--accent);font-weight:800}
  /* EdgeLane brand byline — emerald, italic, default EdgeLane accent */
  .byline{font-style:italic;font-size:10.5px;letter-spacing:1.5px;color:#36d399;font-weight:600;margin-top:3px}
  .tag{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);letter-spacing:1px}
  .tag.sandbox{color:var(--debit);border-color:#5a4a1a;background:#1c1606}
  .tag.production{color:var(--put);border-color:#5a1a1a;background:#1c0606}
  .tag.closed{color:#e6b84a;border-color:#5a4a1a;background:#1c1606;font-weight:700;margin-left:8px;cursor:help}
  .grow{flex:1}
  .clock{color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 360px;gap:14px;margin-top:14px}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h3{margin:0 0 10px;font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;font-weight:700}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ctrls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  select,input[type=number]{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
    border-radius:6px;padding:8px 10px;font-size:14px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  select.big{font-size:15px;font-weight:700;min-width:120px}
  .strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;margin-top:4px}
  .posnote{font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--accent);cursor:help}
  .strat{padding:8px 6px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);
    color:var(--dim);text-align:center;font-size:12px;font-weight:600;transition:.12s}
  .strat:hover{border-color:var(--accent);color:var(--txt)}
  .strat.on{background:var(--accentdim);border-color:var(--accent);color:#fff}
  .strat .k{font-size:10px;letter-spacing:.5px;opacity:.85;display:block;margin-top:2px;text-transform:uppercase}
  .strat.on .k{color:var(--debit)}
  .strat.credit.on .k{color:var(--credit)}
  .spotline{display:flex;gap:18px;align-items:baseline;margin:14px 0 8px}
  .spot{font-size:26px;font-weight:800;color:#fff}
  .spot .sym{color:var(--accent);margin-right:8px}
  .exp{color:var(--dim);font-size:12px}
  table.legs{width:100%;border-collapse:collapse;margin-top:6px}
  table.legs th{font-size:11px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase;text-align:right;padding:4px 8px;font-weight:600}
  table.legs th:first-child,table.legs td:first-child{text-align:left}
  table.legs td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;font-size:14px}
  .side{font-weight:700;font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
  .side.call{color:var(--call);background:#0c2018}
  .side.put{color:var(--put);background:#200c0c}
  .act{font-size:12px;color:var(--dim)}
  .act.buy{color:var(--good)}
  .act.sell{color:var(--put)}
  .stepper{display:inline-flex;align-items:center;gap:2px}
  .stepper button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--txt);font-size:14px;line-height:1;padding:0}
  .stepper button:hover{border-color:var(--accent);color:#fff}
  .strike{display:inline-block;min-width:74px;font-weight:700;font-size:14px}
  .netcard{display:flex;gap:0;margin-top:14px;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .netcard .cell{flex:1;padding:11px 8px;text-align:center;border-right:1px solid var(--line)}
  .netcard .cell:last-child{border-right:0}
  .netcard .cell .lab{font-size:11px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase}
  .netcard .cell .val{font-size:20px;font-weight:800;margin-top:3px}
  .netcard .cell.mid{background:#0d1620}
  .netcard .cell.mid .val{color:#fff}
  .ptype{font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:4px}
  .ptype.debit{color:var(--debit);background:#1c1606}
  .ptype.credit{color:var(--credit);background:#06160e}
  .sendrow{display:flex;gap:10px;align-items:flex-end;margin-top:16px;flex-wrap:wrap}
  .counterband{flex:1 1 160px;min-width:0;overflow:hidden;align-self:stretch;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .counterband .cband-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700}
  .counterband .cband-lab.call{color:var(--call)}
  .counterband .cband-lab.put{color:var(--put)}
  .cband-bar{position:relative;height:6px;border-radius:3px;background:var(--line2);margin-top:10px;margin-bottom:10px}
  .cband-bar i{position:absolute;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--dim);
    display:flex;align-items:center;justify-content:center;font-style:normal;font-size:8.5px;font-weight:800;
    letter-spacing:-.3px;color:#0a0e14;line-height:1;box-shadow:0 0 0 2px var(--panel2);
    transform:translateX(-50%);transition:left .4s,background .4s}
  .counterband.contested .cband-bar i{background:var(--warn);animation:pulse 1.1s infinite}
  .counterband.building .cband-bar i{background:var(--warn)}
  .counterband.committed.c-call .cband-bar i{background:var(--call)}
  .counterband.committed.c-put .cband-bar i{background:var(--put)}
  @media(max-width:900px){.counterband{display:none}}
  .toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
  .toggle .sw{width:36px;height:20px;border-radius:11px;background:var(--line2);position:relative;transition:.15s}
  .toggle .sw::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
  .toggle.on .sw{background:var(--accent)}
  .toggle.on .sw::after{left:18px}
  .btn{padding:11px 18px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--txt);font-weight:700;font-size:13px;letter-spacing:.5px}
  .btn:hover{border-color:var(--accent)}
  .btn.limit{background:var(--accent);border-color:var(--accent);color:#04121f}
  .btn.market{background:#2a1c06;border-color:#5a4a1a;color:var(--debit)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .confirm{margin-top:12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;background:#0c1824;
    display:flex;align-items:center;gap:12px}
  .confirm .summary{font-size:12px;color:#fff;margin-bottom:0;line-height:1.5;flex:1;min-width:0}
  .confirm .btns{display:flex;gap:8px;flex-shrink:0}
  .muted{color:var(--dim)}
  .result{margin-top:14px;padding:12px;border-radius:8px;border:1px solid var(--line2);font-size:12px;white-space:pre-wrap}
  .result.good{border-color:#1c4a32;background:#08160e}
  .result.bad{border-color:#4a1c1c;background:#160808}
  .result .hl{font-weight:800;font-size:13px}
  /* analysis */
  .lean-wrap{margin:2px 0 14px}
  .lean-bar{height:14px;border-radius:7px;background:linear-gradient(90deg,#3a1414,#1d2733 50%,#0c2a1c);position:relative;border:1px solid var(--line2)}
  .lean-bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim2)}
  .lean-bar .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
  .lean-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .lean-val{font-size:22px;font-weight:800}
  .lean-lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:4px}
  .lean-lab.bullish{color:var(--call);background:#0c2018}
  .lean-lab.bearish{color:var(--put);background:#200c0c}
  .lean-lab.neutral{color:var(--dim);background:#151c25}
  .sugg{margin:8px 0 4px;font-size:12px;color:var(--dim)}
  .sugg b{color:var(--txt)}
  .sugg .pill{padding:2px 8px;border-radius:4px;font-weight:700;margin-left:4px}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px}
  .metric .l{font-size:11px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase}
  .metric .v{font-size:15px;font-weight:700;margin-top:2px}
  .bar{height:4px;border-radius:2px;background:var(--line2);margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%}
  .levels{margin-top:12px;font-size:12px}
  .levels .lv{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
  .lean-right{display:flex;align-items:baseline;gap:8px}
  .flowtag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:4px;cursor:help}
  .flowtag.conf,.flowtag.call{color:var(--call);background:#0c2018}
  .flowtag.div,.flowtag.put{color:var(--put);background:#200c0c}
  .flowtag.flat{color:var(--dim);background:#151c25}
  .flowblk{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:help}
  .flowttl{font-size:11px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase;margin-bottom:6px}
  .flowrow{display:flex;align-items:center;gap:14px;font-size:13px;flex-wrap:wrap}
  .flowrow .fcell{display:flex;align-items:center;gap:6px}
  .flowrow .fcell.net{margin-left:auto;gap:8px}
  .flowrow .flab{font-style:normal;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim2)}
  .flowrow .flab.call{color:var(--call)}
  .flowrow .flab.put{color:var(--put)}
  .fverdict{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:4px}
  .fverdict.conf,.fverdict.call{color:var(--call);background:#0c2018}
  .fverdict.div,.fverdict.put{color:var(--put);background:#200c0c}
  .fverdict.flat{color:var(--dim);background:#151c25}
  .flowblk.sess{margin-top:8px}
  .dbar{height:6px;border-radius:3px;background:var(--line2);margin-top:8px;overflow:hidden}
  .dbar i{display:block;height:100%;border-radius:3px;transition:width .3s}
  .sbar{position:relative;height:6px;border-radius:3px;background:var(--line2);margin-top:8px}
  .sbar .szero{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim2);z-index:1}
  .sbar i{position:absolute;top:0;bottom:0;display:block;border-radius:3px;min-width:2px;transition:left .35s,width .35s,background .3s}
  .sbar.cCall i{background:var(--call)}
  .sbar.cPut i{background:var(--put)}
  .sbar.building i{background:var(--warn)}
  .sbar.contested i{background:var(--warn);animation:pulse 1.1s infinite}
  .disc{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.5;border-top:1px solid var(--line);padding-top:8px}
  .tension{display:block;margin-top:8px;padding:4px 10px;border-radius:5px;
    font-size:11px;font-weight:800;letter-spacing:.4px;line-height:1.35;white-space:normal;
    cursor:help;color:#160f00;background:var(--warn);
    box-shadow:0 0 0 1px var(--warn),0 0 12px -3px var(--warn)}
  .err{color:var(--bad);font-size:12px;margin-top:8px}
  .panel.orders{margin-top:14px}
  .watchers{margin:6px 0 10px}
  .watch{font-size:12px;color:var(--accent);padding:6px 10px;background:#10202b;border:1px solid var(--line2);border-radius:7px;margin-bottom:6px}
  .dotpulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  table.otable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  table.otable th{text-align:left;color:var(--dim2);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-bottom:1px solid var(--line)}
  table.otable td{padding:3px 8px;border-bottom:1px solid var(--line)}
  table.otable tr.working td{background:#15202b}
  .ostat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase}
  .ostat.open,.ostat.pending,.ostat.partially_filled,.ostat.ok,.ostat.sent{color:var(--accent);background:#10202b}
  .ostat.filled{color:var(--call);background:#0c2018}
  .ostat.canceled,.ostat.rejected,.ostat.expired,.ostat.error{color:var(--put);background:#200c0c}
  .otabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .otab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 4px;cursor:pointer}
  .otab:hover{color:var(--fg)}
  .otab.on{color:var(--fg);border-bottom-color:var(--accent)}
  .btn.xcancel{padding:2px 8px;font-size:10px;background:#2a1414;color:#f0a0a0;border:1px solid #5a2828}
  .pxedit{cursor:pointer;border-bottom:1px dotted var(--dim2)}
  .pxedit:hover{color:var(--accent)}
  .pxrow{display:inline-flex;gap:3px;align-items:center}
  .pxrow input{width:70px;background:var(--panel2);border:1px solid var(--accent);color:var(--txt);border-radius:4px;padding:2px 5px;font-size:11px}
  .btn.xsave{padding:2px 7px;font-size:11px;background:#0c2018;color:var(--call);border:1px solid #1c4a30}
  .btn.xx{padding:2px 6px;font-size:11px;background:var(--panel2);color:var(--dim);border:1px solid var(--line2)}
  .spin{color:var(--dim);font-size:12px}
  .flash{animation:fl .6s}
  @keyframes fl{0%{background:#13202c}100%{background:transparent}}
  .site-foot{flex:0 0 auto;padding:6px 8px;text-align:center;border-top:1px solid var(--line);color:var(--dim2);font-size:11px;line-height:1.5}
  .social-btn,.share-btn{display:inline-flex;align-items:center;gap:6px;color:var(--dim);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;cursor:pointer;text-decoration:none;transition:.15s}
  .social-btn{width:28px;height:28px;justify-content:center}
  .share-btn{height:28px;padding:0 10px;font:inherit;font-size:11px;letter-spacing:.5px}
  .social-btn:hover,.share-btn:hover{border-color:var(--accent);color:#fff}
  .strat-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
  .share-top{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .heur-note{flex:1 1 auto;min-width:0;font-size:9px;line-height:1.2;color:var(--dim);letter-spacing:0;text-transform:none;font-weight:400}
  .heur-note .hwarn{color:var(--warn);font-weight:700;margin-right:3px}
  .site-foot .cpy a{color:var(--accent);cursor:pointer;text-decoration:none}
  .site-foot .cpy a:hover{text-decoration:underline}
  .site-foot .fdot{opacity:.45;margin:0 5px}
  .site-foot .ver{opacity:.7;letter-spacing:.3px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;max-width:460px;text-align:left}
  .modal h4{margin:0 0 10px;color:var(--accent);font-size:14px;letter-spacing:.5px}
  .modal p{margin:0 0 13px;line-height:1.55;color:var(--dim);font-size:12.5px}
  .modal p a{color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;
const API='';
// Torque is an admin/owner tool — the page is opened with ?token=<ADMIN_API_TOKEN>;
// we stash it (sessionStorage, per-tab) and attach it as X-Admin-Token on every
// fetch. Auth is a no-op when the backend runs with AUTH_ENABLED=false (dev).
const TOK=(new URLSearchParams(location.search).get('token'))||sessionStorage.getItem('tq_tok')||'';
if(TOK)sessionStorage.setItem('tq_tok',TOK);
const j=(u,o={})=>fetch(API+u,{...o,headers:{...(o.headers||{}),...(TOK?{'X-Admin-Token':TOK}:{})}}).then(async r=>{const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={detail:t}}if(!r.ok)throw new Error(d.detail||r.statusText);return d});
const fmt=(n,d=2)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=n=>n==null?'—':Number(n).toLocaleString('en-US');
const fmtTime=s=>{if(!s)return '—';const d=new Date(s);return isNaN(d)?'—':d.toLocaleTimeString();};
// Torque tags every order "torque<strategy>" (entry) or "torqueClose<strategy>";
// turn that back into a readable label for the Past Orders list.
const tagLabel=tag=>{tag=tag||'';const close=/^torqueClose/i.test(tag);
  const s=tag.replace(/^torqueClose/i,'').replace(/^torque/i,'').replace(/_/g,' ');
  return (close?'close · ':'')+(s||'—');};

function App(){
  const [cfg,setCfg]=useState(null);
  const [ticker,setTicker]=useState(null);
  const [strategy,setStrategy]=useState(null);
  const [adj,setAdj]=useState({});
  const [build,setBuild]=useState(null);
  const [price,setPrice]=useState(null);      // live reprice
  const [lockStrikes,setLockStrikes]=useState(false); // freeze strikes; keep repricing them
  const anchorRef=useRef(null);               // frozen spot the locked strikes derive from
  const [analysis,setAnalysis]=useState(null);
  const [flow,setFlow]=useState(null);           // 3m instant call/put $ flow
  const [sess,setSess]=useState(null);           // trailing-60m cumulative flow (CVD)
  const flowBuf=useRef([]);                       // per-poll {t,dc,dp} $ increments, ≤60m
  const prevRaw=useRef(null);                     // last raw {cv,pv,cd,pd} to diff against
  const autoStratRef=useRef(null);                // ticker we've auto-landed a strategy for
  const flipRef=useRef({side:0,since:0});          // session-flow: side (+1 call / -1 put) + ms-ts of last zero-cross
  // Counter Read: relative-richness lean between the current structure and its
  // natural opposite (see COUNTER_STRATEGY on the backend / docs/torque.md Layer 4).
  const counterEmaRef=useRef(null);                 // smoothed ratio 0..1, null until first sample
  const counterTsRef=useRef(0);                     // ms timestamp of the last EMA update
  const counterHoldRef=useRef({side:0,since:0});    // +1 leaning current / -1 leaning counter / 0 contested
  const [counterRead,setCounterRead]=useState(null);
  const [limit,setLimit]=useState('');
  const [userLimit,setUserLimit]=useState(false);
  const [qty,setQty]=useState(1);
  const [duration,setDuration]=useState('day');
  const [autoClose,setAutoClose]=useState(true);
  const [targetPct,setTargetPct]=useState(30);
  const [confirm,setConfirm]=useState(null);    // {order_type}
  const [placing,setPlacing]=useState(false);
  const [result,setResult]=useState(null);
  const [err,setErr]=useState(null);
  const [now,setNow]=useState('');
  const [mktClock,setMktClock]=useState(null);   // {market_state, open} from Yahoo (holiday-aware)
  // Past Orders is now account-wide: it comes from the /torque/orders `history`
  // list (every Torque-tagged order on the broker account), so it's identical from
  // any tab and shows the broker's own live status. No per-tab tracking here.

  useEffect(()=>{const t=setInterval(()=>setNow(new Date().toLocaleTimeString()),1000);return()=>clearInterval(t)},[]);

  // market clock: Yahoo marketState, polled slowly and ALWAYS (even when closed, so
  // we notice the reopen). Authoritative over the local weekday+time gate — it knows
  // holidays and early closes. On failure (open==null) we fall back to isMarketOpen().
  useEffect(()=>{let live=true;
    const run=()=>j('/torque/clock').then(c=>{if(live)setMktClock(c)}).catch(()=>{if(live)setMktClock(null)});
    run();const t=setInterval(run,45000);return()=>{live=false;clearInterval(t)};
  },[]);

  // the order-status panel (entry id / SENT confirmation) auto-clears after 10s
  // so it doesn't linger — the order lives on in Working / Past Orders below.
  useEffect(()=>{if(!result)return;const t=setTimeout(()=>setResult(null),10000);return()=>clearTimeout(t);},[result]);

  // config
  useEffect(()=>{j('/torque/config').then(c=>{
    setCfg(c);setTicker(c.tickers[0]);setStrategy(c.default_strategy);setTargetPct(c.close_target_pct);
  }).catch(e=>setErr('config: '+e.message))},[]);

  // Per-ticker auto-close target. Wide-spread names (DJX) have a hard server-side
  // floor — a target under it prices the close order inside the package bid/ask and
  // can never fill, so /torque/place clamps UP. Mirror that here: prefill the
  // ticker's default on switch and don't let the input go below its floor.
  const ctgt=(cfg&&cfg.close_targets&&ticker&&cfg.close_targets[ticker])||null;
  useEffect(()=>{if(ctgt)setTargetPct(ctgt.default);},[ticker]);   // eslint-disable-line

  const sdef=cfg&&strategy?cfg.strategies.find(s=>s.key===strategy):null;
  // Options-data polling pauses outside market hours in PRODUCTION only; sandbox/dev
  // always polls so it stays testable off-hours (mirrors backend DEVMODE gating).
  // Prefer Yahoo's live marketState (holiday/half-day aware); fall back to the local
  // weekday+time gate only if the clock is unavailable. Recomputes every render — the
  // 1s clock keeps it fresh.
  const liveGate=cfg&&!cfg.devmode&&cfg.env!=='sandbox';
  const mktOpen=!liveGate?true:(mktClock&&mktClock.open!=null)?mktClock.open:isMarketOpen();

  // build (on ticker/strategy/adj change)
  const doBuild=useCallback(()=>{
    if(!ticker||!strategy)return;
    setErr(null);
    j('/torque/build',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:ticker,strategy,adjustments:adj,anchor_spot:anchorRef.current})})
      .then(b=>{setBuild(b);
        // only accept a COMPLETE net price; keep the last good one otherwise so
        // a momentary missing leg never flickers a partial single-leg number.
        if(b.price&&b.price.complete){setPrice(b.price);if(!userLimit)setLimit(String(b.suggested_limit));}
        // Counter Read: piggybacks on this same 3s tick — no separate poll. A time-based
        // EMA (tau=15s) smooths bid/ask jitter on the ratio; the hold-timer (mirrors
        // sessionFlow's flipRef pattern) tracks how long it's stayed off-center for color.
        const sides=cfg?counterSides(strategy,cfg.strategies,b):null;
        if(sides){
          const ratio=sides.aRichness/(sides.aRichness+sides.bRichness);
          const now=Date.now();
          const prevEma=counterEmaRef.current;
          const prevTs=counterTsRef.current;
          const ema=(prevEma==null)?ratio:prevEma+(ratio-prevEma)*(1-Math.exp(-(now-prevTs)/15000));
          counterEmaRef.current=ema;counterTsRef.current=now;
          const sd=ema>0.58?1:ema<0.42?-1:0;
          if(sd!==counterHoldRef.current.side)counterHoldRef.current={side:sd,since:now};
          const heldMs=sd!==0?now-counterHoldRef.current.since:0;
          const state=sd===0?'contested':heldMs>=60000?'committed':'building';
          setCounterRead({...sides,ratio:ema,side:sd,state,heldMs});
        }
      })
      .catch(e=>{setErr('build: '+e.message);setBuild(null)});
  },[ticker,strategy,adj,userLimit]);
  // Background tabs get their setInterval throttled to ~1/min (or frozen) by
  // Chromium, so a backgrounded ticker's spot — and the legs derived from it —
  // appear stuck while the foreground tab stays live. Bump focusTick whenever the
  // tab becomes visible/focused; it's a dep of every poll effect below, so each
  // re-fires an immediate fetch on return instead of waiting out a throttled tick.
  // Declared HERE — before the first effect that reads it (const isn't hoisted).
  const [focusTick,setFocusTick]=useState(0);
  useEffect(()=>{
    const wake=()=>{if(!document.hidden)setFocusTick(t=>t+1)};
    document.addEventListener('visibilitychange',wake);
    window.addEventListener('focus',wake);
    return()=>{document.removeEventListener('visibilitychange',wake);window.removeEventListener('focus',wake);};
  },[]);
  useEffect(()=>{if(mktOpen)doBuild()},[ticker,strategy,adj,mktOpen,focusTick]);

  // reset on ticker/strategy change
  useEffect(()=>{setAdj({});setUserLimit(false);setResult(null);setLockStrikes(false);anchorRef.current=null;
    counterEmaRef.current=null;counterTsRef.current=0;counterHoldRef.current={side:0,since:0};setCounterRead(null);},[ticker,strategy]);

  // roll the call/put premium-$ traded into a 3-min flow window (browser-only).
  // Volume is cumulative intraday, so the delta of (mid×volume) over the window
  // is the premium $ that hit each side in the last few minutes — where money is
  // moving NOW, vs the static lean which is where positioning already sits.
  const trackFlow=(a)=>{
    const v=a&&a.components&&a.components.volume;
    if(!v||v.call==null||v.put==null||v.call_dollar==null||v.put_dollar==null)return;
    const now=Date.now(),pr=prevRaw.current;
    // per-poll increment: NEW contracts since the last poll (cumulative vol → Δ ≥ 0),
    // valued at the side's CURRENT $/contract. Never diff mid×cumVol — that revalues
    // the whole day's volume on a mid tick and leaks the price move into the flow.
    if(pr){
      const dc=v.call>0?Math.max(0,v.call-pr.cv)*(v.call_dollar/v.call):0;
      const dp=v.put >0?Math.max(0,v.put -pr.pv)*(v.put_dollar /v.put ):0;
      const buf=flowBuf.current;
      buf.push({t:now,dc,dp});
      while(buf.length&&now-buf[0].t>SESS_WINDOW_MS)buf.shift();   // keep trailing 60m
      setFlow(windowFlow(buf,now-FLOW_WINDOW_MS));                  // last-3m slice (fast)
      const s=sessionFlow(buf);                                    // full 60m CVD (slow)
      if(s){
        const sd=s.net>0?1:s.net<0?-1:0;
        if(sd!==0&&sd!==flipRef.current.side)flipRef.current={side:sd,since:now};  // net crossed zero -> mark the flip
        s.heldMs=(sd!==0&&flipRef.current.side===sd)?(now-flipRef.current.since):0; // how long held this side since the flip
      }
      setSess(s);
    }
    prevRaw.current={cv:v.call,pv:v.put,cd:v.call_dollar,pd:v.put_dollar};
  };

  // reset the flow windows on ticker change ONLY — not when the market closes, so
  // the session flow freezes in place at the close instead of getting wiped.
  useEffect(()=>{flowBuf.current=[];prevRaw.current=null;flipRef.current={side:0,since:0};setFlow(null);setSess(null);},[ticker]);

  // analysis poll 5s — paused outside market hours (options data stops after 4pm ET)
  useEffect(()=>{
    if(!ticker||!mktOpen)return;let live=true;
    const run=()=>j('/torque/analyze/'+ticker).then(a=>{if(live){setAnalysis(a);trackFlow(a);}}).catch(()=>{});
    run();const t=setInterval(run,5000);return()=>{live=false;clearInterval(t)};
  },[ticker,mktOpen,focusTick]);

  // auto-land the strategy grid on the structure the snapshot makes playable —
  // ONCE per ticker, then leave it alone so manual picks stick (never yanks
  // mid-build). bullish→bull_call, bearish→bear_put, balanced→iron_condor
  // (iron_fly when OI is pinned tight to a near-spot magnet).
  useEffect(()=>{
    if(!analysis||!cfg||analysis.symbol!==ticker)return;
    if(autoStratRef.current===ticker)return;
    autoStratRef.current=ticker;
    const rec=recommendStrategy(analysis);
    if(rec&&cfg.strategies.some(s=>s.key===rec))setStrategy(rec);
  },[analysis,cfg,ticker]);

  // live re-anchor + reprice every 3s: rebuild re-derives strikes from the
  // current spot (keeping any manual ±steps in adj) and returns fresh net
  // bid/mid/ask, so spot, strikes, and prices all move together and stay in
  // sync with the chain. Paused while confirming or placing so strikes don't
  // shift under the user. The chain itself is cached 2s server-side, so this
  // is at most one fetch per tick.
  useEffect(()=>{
    if(!ticker||!strategy||confirm||placing||!mktOpen)return;let live=true;
    const t=setInterval(()=>{if(live)doBuild()},3000);
    return()=>{live=false;clearInterval(t)};
  },[ticker,strategy,confirm,placing,mktOpen,doBuild,focusTick]);

  const step=(role,n)=>setAdj(a=>({...a,[role]:(a[role]||0)+n}));

  // Lock Strikes: freeze the spot anchor so strikes stop re-centering as price
  // moves. ±steppers still work (relative to the frozen anchor) and premiums keep
  // repricing live off the chain. Toggling off drops the anchor → resumes normal
  // auto-anchoring to live spot.
  const toggleLock=()=>{
    if(!build||build.spot==null)return;
    const nv=!lockStrikes;
    anchorRef.current=nv?build.spot:null;
    setLockStrikes(nv);
    if(mktOpen)doBuild();
  };

  // busy cursor for any in-flight request (place is the slow one)
  useEffect(()=>{document.body.style.cursor=placing?'progress':'';return()=>{document.body.style.cursor='';};},[placing]);

  // orders panel: poll working + auto-close watchers every 4s. Fetch once always
  // (so resting GTC orders show, and to capture final state at the close), but the
  // recurring poll runs only during market hours — nothing fills after 4pm ET.
  const [orders,setOrders]=useState(null);
  useEffect(()=>{let live=true;
    const run=()=>j('/torque/orders').then(o=>{if(live)setOrders(o)}).catch(()=>{});
    run();
    if(!mktOpen)return()=>{live=false};
    const t=setInterval(run,4000);return()=>{live=false;clearInterval(t)};
  },[mktOpen,focusTick]);
  const refreshOrders=()=>j('/torque/orders').then(setOrders).catch(()=>{});

  const cancelOrder=(id)=>{setPlacing(true);
    j('/torque/cancel/'+id,{method:'POST'}).catch(e=>setErr('cancel: '+e.message))
      .finally(()=>{setPlacing(false);refreshOrders();});};
  const modifyOrder=(id,price)=>{setPlacing(true);
    j('/torque/modify/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price:Number(price)})})
      .catch(e=>setErr('modify: '+e.message)).finally(()=>{setPlacing(false);refreshOrders();});};

  const place=(order_type,dry=false)=>{
    setPlacing(true);setResult(null);setErr(null);
    const legs=build.legs.map(l=>({symbol:l.symbol,action:l.action,quantity:l.quantity,side:l.side,strike:l.strike,role:l.role}));
    const body={symbol:ticker,strategy,legs,order_type,
      limit_price:order_type==='limit'?Number(limit):null,duration,quantity:Number(qty),
      // DJX-class tickers: auto-close is mandatory, so always request it.
      auto_close:(price&&price.auto_close_required)?true:(autoClose&&!(price&&price.untradeable)),
      close_target_pct:Number(targetPct),
      spread_type:build.type,confirm:!dry,dry_run:dry};
    j('/torque/place',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>{setResult(r);if(!dry)refreshOrders();})   // pull the new order into the account-wide lists
      .catch(e=>setErr('place: '+e.message))
      .finally(()=>{setPlacing(false);setConfirm(null)});
  };

  if(!cfg)return <div className="wrap"><div className="spin">loading…{err&&<div className="err">{err}</div>}</div></div>;
  // last KNOWN-complete net price (sticky). build.price is only used as the
  // initial value and only if itself complete — never a partial.
  const bp=build&&build.price;
  const p=price||((bp&&bp.complete)?bp:null);
  const fst=analysis?flowState(flow,analysis.lean):null;   // live flow vs the lean
  // Live floor from /torque/price (spread-aware) — falls back to the ticker's
  // static min until the first price tick lands. Mirrors the server's clamp.
  const tgtMin=(p&&p.min_close_target_pct!=null)?p.min_close_target_pct:(ctgt?ctgt.min:1);
  const mktAllowed=(p&&p.market_orders_allowed!=null)?p.market_orders_allowed
                   :!(ctgt&&ctgt.spread_scaled);
  const untradeable=!!(p&&p.untradeable);
  // Auto-close is MANDATORY on some tickers (DJX): the % is editable, the toggle
  // is not. Falls back to the config flag until the first price tick lands.
  const acRequired=(p&&p.auto_close_required!=null)?p.auto_close_required:!!(ctgt&&ctgt.required);
  // A mandatory exit that cannot fill ⇒ no trade at all.
  const blocked=untradeable&&acRequired;
  const tens=(analysis&&sess&&fst)?tensionRead(sess,analysis.lean,analysis.components.premium_skew.signal,fst):null;

  return <div className="wrap">
    <header>
      <img className="logomark" src="/torque/assets/torque-logo.svg" alt="Torque"/>
      <div className="brand">
        <div className="logo">TORQUE<small>·</small></div>
        <div className="byline">by EDGELANE</div>
      </div>
      <span className={"tag "+(cfg.env==='sandbox'||cfg.devmode?'sandbox':'production')}>
        {cfg.devmode||cfg.env==='sandbox'?'SANDBOX':'PRODUCTION'} · {cfg.mode}</span>
      {!mktOpen&&<span className="tag closed" title="Polling pauses whenever the market isn't in its regular session — from Yahoo's live marketState, so holidays and early closes are handled automatically (no calendar). Positioning/flow freeze; orders shown as of the pause (cancel/modify still work). Resumes automatically at the next regular session.">MARKET {mktLabel(mktClock)} · PAUSED</span>}
      <div className="grow"></div>
      <div className="clock">{now}</div>
    </header>

    <div className="row" style={{marginTop:14,gap:14,alignItems:'flex-start'}}>
      <label className="fld">Ticker
        <select className="big" value={ticker||''} onChange={e=>setTicker(e.target.value)}>
          {cfg.tickers.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </label>
      <div style={{flex:1}}>
        <div className="strat-head">
          <label className="fld" style={{margin:0,flexShrink:0}}>Strategy
            {analysis&&<span className="posnote" title={POSNOTE_HELP}> · positioning now: {LEAN_LAB[analysis.label]||analysis.label} <span className="muted">— where the market sits, not a recommended play</span></span>}
          </label>
          {analysis&&<div className="heur-note"><span className="hwarn">⚠</span>{analysis.disclaimer}</div>}
          <ShareRow/>
        </div>
        <div className="strat-grid">
          {cfg.strategies.map(s=>
            <div key={s.key} className={"strat "+(s.type)+(strategy===s.key?' on':'')}
                 onClick={()=>setStrategy(s.key)}>
              {s.short}<span className="k">{s.type}{s.legs>1?' · '+s.legs+'L':''}</span>
            </div>)}
        </div>
      </div>
    </div>

    <div className="grid">
      {/* ── order builder ── */}
      <div className="panel">
        <div className="spotline">
          <div className="spot"><span className="sym">{ticker}</span>{(()=>{const s=(build&&build.symbol===ticker?build.spot:null)??(analysis&&analysis.symbol===ticker?analysis.spot:null);return s!=null?fmt(s,2):'—';})()}</div>
          <div className="exp">exp {build?build.expiration:'—'} · 0DTE</div>
          {sdef&&<span className={"ptype "+sdef.type} style={{alignSelf:'center'}}>{sdef.name} · {sdef.type}</span>}
          <div className={"toggle lockstrikes"+(lockStrikes?' on':'')} onClick={toggleLock}
               title="Lock the strikes in place so they stop re-centering as spot moves. Set exactly the strikes you want with the −/+ steppers — premiums keep updating live for those strikes. Toggle off to resume auto-anchoring to spot."
               style={{marginLeft:'auto',alignSelf:'center',opacity:build?1:0.45,cursor:build?'pointer':'not-allowed'}}>
            <span className="sw"></span> Lock Strikes
          </div>
        </div>

        {build&&build.missing_legs&&build.missing_legs.length>0&&
          <div className="err">⚠ no listed strike for legs: {build.missing_legs.join(', ')} — step them into the grid.</div>}

        <table className="legs">
          <thead><tr><th>Leg</th><th>Side</th><th>Action</th><th>Strike</th><th>Mid</th></tr></thead>
          <tbody>
            {build&&build.legs.map((l,i)=>{
              const lp=p&&p.legs&&p.legs.find(x=>x.role===l.role);
              return <tr key={l.role+i}>
                <td className="muted">{l.role.replace('_',' ')}</td>
                <td><span className={"side "+l.side}>{l.side.toUpperCase()}</span></td>
                <td><span className={"act "+(l.action.startsWith('buy')?'buy':'sell')}>
                  {l.action.startsWith('buy')?'BUY':'SELL'}{l.quantity>1?' ×'+l.quantity:''}</span></td>
                <td>
                  <span className="stepper">
                    <button onClick={()=>step(l.role,-1)}>−</button>
                    <span className="strike">{fmt(l.strike,0)}</span>
                    <button onClick={()=>step(l.role,1)}>+</button>
                  </span>
                </td>
                <td>{lp?fmt(lp.mid):'—'}</td>
              </tr>;
            })}
            {!build&&<tr><td colSpan="5" className="spin">{mktOpen?'building…':'market closed — options data paused'}</td></tr>}
          </tbody>
        </table>

        {/* net price */}
        {p?<div className="netcard">
          <div className="cell"><div className="lab">Bid</div><div className="val" style={{color:'var(--dim)'}}>{fmt(p.abs_bid)}</div></div>
          <div className="cell mid"><div className="lab">Mid ({p.type})</div>
            <div className="val" style={{color:p.type==='debit'?'var(--debit)':'var(--credit)'}}>{fmt(p.abs_mid)}</div></div>
          <div className="cell"><div className="lab">Ask</div><div className="val" style={{color:'var(--dim)'}}>{fmt(p.abs_ask)}</div></div>
        </div>:<div className="netcard"><div className="cell"><div className="lab">Net</div><div className="val" style={{color:'var(--dim)'}}>pricing…</div></div></div>}

        {/* order controls */}
        <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
          <div style={{flex:'0 0 auto'}}>
            <div className="sendrow">
              <label className="fld">Limit Price
                <input type="number" step="0.05" value={limit}
                  onChange={e=>{setLimit(e.target.value);setUserLimit(true)}} style={{width:110}}/>
              </label>
              <label className="fld">Qty
                <input type="number" min="1" max="50" value={qty} onChange={e=>setQty(e.target.value)} style={{width:70}}/>
              </label>
              <label className="fld">TIF
                <select value={duration} onChange={e=>setDuration(e.target.value)}>
                  <option value="day">DAY</option><option value="gtc">GTC</option></select>
              </label>
              {/* acRequired (DJX): the toggle is locked ON — the target % stays editable
                  (floored), but the exit can never be disarmed. The server rejects
                  auto_close=false for these tickers, so the UI must not offer it. */}
              <div className={"toggle"+((autoClose||acRequired)?' on':'')}
                onClick={()=>{if(!acRequired)setAutoClose(v=>!v);}}
                title={acRequired?ticker+': auto-close is required — its spread is too wide to hold a position without a resting exit':undefined}
                style={{alignSelf:'center',marginBottom:4,cursor:acRequired?'not-allowed':'pointer'}}>
                <span className="sw"></span> auto-close +
                <input type="number" min={tgtMin} max="500" value={targetPct}
                  onClick={e=>e.stopPropagation()}
                  onChange={e=>setTargetPct(e.target.value)}
                  onBlur={e=>{const v=Number(e.target.value);if(!(v>=tgtMin))setTargetPct(tgtMin);}}
                  style={{width:54,padding:'4px 6px',fontSize:12}}/>%
                {tgtMin>1&&<span className="muted" style={{fontSize:11,marginLeft:6}}>min {fmt0(tgtMin)}%</span>}
                {acRequired&&<span className="muted" style={{fontSize:11,marginLeft:6,fontWeight:700}}>required</span>}
              </div>
            </div>

            <div className="sendrow">
              <button className="btn limit" disabled={!build||placing||!limit||blocked} onClick={()=>setConfirm({t:'limit'})}
                title={blocked?ticker+': auto-close is required but the book is too wide for any target to fill — no trade':undefined}>
                SEND LIMIT ${limit||'—'}</button>
              <button className="btn market" disabled={!build||placing||!mktAllowed||blocked} onClick={()=>setConfirm({t:'market'})}
                title={mktAllowed?undefined:ticker+' has too wide a book for a market order — its ask can be ~2x the mid. Use a limit.'}>
                SEND MARKET</button>
              <button className="btn" disabled={!build||placing||!limit} title="Validate format against the broker — places nothing"
                onClick={()=>place('limit',true)}>DRY RUN</button>
              {placing&&<span className="spin" style={{alignSelf:'center'}}>working…</span>}
            </div>
          </div>
          {counterRead&&<div className={"counterband "+counterRead.state+(counterRead.state==='committed'?(' c-'+(counterRead.side>0?counterRead.aSide:counterRead.bSide)):'')}
            title="Counter Read — relative richness vs the opposite structure, priced from the same chain/spot. A rich, committed counter side is a cue to adjust strikes/distance before you send — this is a relative-value lean, not a forecast.">
            <div className="cband-row">
              <span className={"cband-lab "+counterRead.aSide}>{counterRead.aLabel}</span>
              <span className={"cband-lab "+counterRead.bSide} style={{textAlign:'right'}}>{counterRead.bLabel}</span>
            </div>
            {/* aLabel sits left, bLabel sits right (row above) — dot must move toward
                whichever side is richer, so it's (1-ratio): high ratio (A richer)
                pulls the dot LEFT toward aLabel, low ratio (B richer) pushes it RIGHT
                toward bLabel. ratio*100 directly was backwards — dot landed next to
                the label with LESS richness. */}
            <div className="cband-bar"><i style={{left:((1-counterRead.ratio)*100)+'%'}}>
              {Math.round((counterRead.ratio>=0.5?counterRead.ratio:1-counterRead.ratio)*100)}%</i></div>
            <div className="cband-row muted" style={{fontSize:10,marginTop:3}}>
              <span>{fmt(counterRead.aMid)}</span>
              <span style={{marginLeft:'auto'}}>{fmt(counterRead.bMid)}</span>
            </div>
            <div className="muted" style={{fontSize:10,marginTop:3}}>
              leaning {counterRead.side===0?'neither':(counterRead.side>0?counterRead.aLabel:counterRead.bLabel)} · {counterRead.state}
              {/* Credit pairs (Bull Put/Bear Call, and the IC/Iron-Fly wing split — both
                  are credit too): the richer side is where premium is dangerous to SELL
                  into, not a cue to sell it — flag that, since it's the opposite reading
                  from a debit pair (there, the richer side IS the trade). No warning while
                  contested (side===0, no lean to warn about) or on debit pairs. */}
              {counterRead.isCredit&&counterRead.side!==0&&
                <span style={{color:'var(--warn)'}}> (selling {(counterRead.side>0?counterRead.aLabel:counterRead.bLabel).toLowerCase()} might be riskier)</span>}
              {counterRead.state==='committed'?' · held '+fmtHeld(counterRead.heldMs):''}
            </div>
          </div>}
        </div>

        {/* What crossing actually costs. Not a fee — you pay the ask and are
            immediately marked at the mid, so it shows up as instant unrealized loss. */}
        {p&&p.complete&&p.marketable_price!=null&&<div className="muted" style={{fontSize:11,marginTop:6,lineHeight:1.5}}>
          cross now: <b>${fmt(p.marketable_price)}</b> ({p.type}) · fair mid <b>${fmt(p.abs_mid)}</b>
          {p.cross_cost>0&&<> · <span style={{color:p.package_spread_pct>=25?'var(--bad)':'inherit'}}>
            {p.type==='credit'?'under-collect':'overpay'} ${fmt(p.cross_cost)}
            {p.package_spread_pct!=null?' · spread '+fmt0(p.package_spread_pct)+'% of mid':''}</span></>}
          {/* Pre-calculated close economics: breakeven and the floored target, both
              net of the round-trip commission (per contract, per leg, open+close). */}
          {p.breakeven_at_mid!=null&&<><br/>
            if filled at mid ${fmt(p.abs_mid)} → breakeven <b>${fmt(p.breakeven_at_mid)}</b>
            {' '}· close target <b>${fmt(p.close_target_at_mid)}</b> (min {fmt0(p.min_close_target_pct)}%)
          </>}
          {p.breakeven_at_market!=null&&p.cross_cost>0&&<><br/>
            <span style={{color:p.package_spread_pct>=25?'var(--bad)':'inherit'}}>
            if you cross at ${fmt(p.marketable_price)} → breakeven <b>${fmt(p.breakeven_at_market)}</b>
            {' '}· close target <b>${fmt(p.close_target_at_market)}</b></span></>}
          {p.round_trip_fee>0&&<><br/><span style={{opacity:.75}}>
            round-trip commission ${fmt(p.fee_per_contract)}/contract/leg = ${fmt(p.round_trip_fee,4)} of
            premium (already folded into the targets above)</span></>}
          {p.untradeable&&<><br/><span style={{color:'var(--bad)',fontWeight:700}}>
            book too wide — no profit target can fill{blocked?'; auto-close is required, so this trade is blocked':'; auto-close is blocked'}</span></>}
        </div>}

        {confirm&&<div className="confirm">
          <div className="summary">
            <b>{confirm.t==='market'?'MARKET':'LIMIT $'+limit}</b> · {sdef.name} · {ticker} · {qty} contract{qty>1?'s':''} · {duration.toUpperCase()}
            {(autoClose||acRequired)&&<><br/><span className="muted">↳ auto-close at +{targetPct}% once the entry confirms FILLED
              {sdef.legs===1&&confirm.t==='limit'?' (native OTO bracket)':' (place→confirm→close)'}</span></>}
            <br/><span className="muted">{build.legs.map(l=>(l.action.startsWith('buy')?'+':'-')+(l.quantity>1?l.quantity:'')+l.side[0].toUpperCase()+fmt(l.strike,0)).join('  ')}</span>
          </div>
          <div className="btns">
            <button className="btn limit" disabled={placing} onClick={()=>place(confirm.t)}>CONFIRM & SEND</button>
            <button className="btn" onClick={()=>setConfirm(null)}>cancel</button>
          </div>
        </div>}

        {err&&<div className="err">{err}</div>}
        {result&&<ResultView r={result}/>}
      </div>

      {/* ── analysis ── */}
      <div className="panel">
        <h3>Positioning <span className="muted" style={{textTransform:'none',letterSpacing:0}}>(snapshot — not a forecast)</span>
          {!mktOpen&&<span className="muted" style={{textTransform:'none',letterSpacing:0,color:'var(--put)'}}> · paused · frozen at close</span>}</h3>
        {!analysis&&<div className="spin">analyzing…</div>}
        {analysis&&<>
          <div className="lean-head" title={LEAN_HELP}>
            <div className="lean-val" style={{color:leanColor(analysis.lean)}}>{analysis.lean>0?'+':''}{Math.round(analysis.lean)}</div>
            <div className="lean-right">
              <div className={"lean-lab "+analysis.label}>{LEAN_LAB[analysis.label]||analysis.label}</div>
              {fst&&<span className={"flowtag "+fst.cls} title={FLOW_HELP}>{fst.arrow} {fst.word}</span>}
            </div>
          </div>
          <div className="lean-wrap"><div className="lean-bar"><div className="mid"></div>
            <div className="dot" style={{left:(50+analysis.lean/2)+'%',background:leanColor(analysis.lean)}}></div></div></div>
          <div className="sugg">premium / OI clusters:
            {analysis.suggested_side
              ? <span className={"pill side "+analysis.suggested_side}>{analysis.suggested_side==='call'?'CALL-SIDE':'PUT-SIDE'}</span>
              : <span className="pill" style={{color:'var(--dim)'}}>BALANCED</span>}
            {analysis.suggested_side&&sdef&&sdef.legs===1&&<button className="btn" style={{marginLeft:8,padding:'3px 8px',fontSize:11}}
              onClick={()=>setStrategy(analysis.suggested_side==='call'?'long_call':'long_put')}>use →</button>}
          </div>
          <div className="flowblk" title={FLOW_HELP}>
            <div className="flowttl">flow · last 3m <span className="muted" style={{textTransform:'none',letterSpacing:0,fontWeight:400}}>· premium $ traded · this tab only</span></div>
            {fst?<div className="flowrow">
              <span className="fcell"><i className="flab call">calls</i><b>+${abbr(fst.call)}</b></span>
              <span className="fcell"><i className="flab put">puts</i><b>+${abbr(fst.put)}</b></span>
              <span className="fcell net"><i className="flab">net</i>
                <b style={{color:fst.net>0?'var(--call)':fst.net<0?'var(--put)':'var(--dim)'}}>
                  {fst.net>0?'+':fst.net<0?'−':''}${abbr(fst.net)}{fst.net>0?' call':fst.net<0?' put':''}</b>
                <span className={"fverdict "+fst.cls}>{fst.word}</span></span>
            </div>:<div className="muted" style={{fontSize:12,padding:'2px 0'}}>building flow window… (need ~10s of polling)</div>}
          </div>
          <div className="flowblk sess" title={SESS_HELP}>
            <div className="flowttl">session flow · trailing 60m <span className="muted" style={{textTransform:'none',letterSpacing:0,fontWeight:400}}>· cumulative Δ · this tab only</span></div>
            {sess?<>
              <div className="flowrow">
                <span className="fcell net" style={{marginLeft:0}}><i className="flab">net</i>
                  <b style={{fontSize:16,color:sess.net>0?'var(--call)':sess.net<0?'var(--put)':'var(--dim)'}}>
                    {sess.net>0?'+':sess.net<0?'−':''}${abbr(sess.net)}{sess.net>0?' call':sess.net<0?' put':''}</b></span>
                <span className={"fverdict "+sess.regimeCls} style={{marginLeft:'auto',fontSize:11}}>{sess.regime}</span>
              </div>
              <div className={"sbar "+sess.commitCls} title="Signed flow bar. Center line = the flip point (call/put parity). Fill grows FROM center: right/green = call pressure, left/red = put pressure; length = how far past the flip (|net|/gross). Amber & pulsing = right at the flip line / contested, the sign isn't trustworthy yet. Solid green/red = persistent and clear of the flip.">
                <span className="szero"></span>
                <i style={{left:(sess.net>=0?50:50-sess.half)+'%',width:sess.half+'%'}}></i>
              </div>
              <div className="muted" style={{fontSize:11,marginTop:5}}>{sess.agree}/{sess.total} windows {sess.sideWord} · <b style={{color:sess.net>=0?'var(--call)':'var(--put)',fontWeight:800,fontSize:12.5}}>{Math.round(sess.dir*100)}%</b> {sess.net>=0?'call':'put'} dominance{sess.heldMs>0?' · held '+fmtHeld(sess.heldMs):''}</div>
            </>:<div className="muted" style={{fontSize:12,padding:'2px 0'}}>building session window… (fills over a few minutes)</div>}
          </div>
          <div className="metrics">
            <Metric l="Premium skew" v={null} sig={analysis.components.premium_skew.signal} txt={sigTxt(analysis.components.premium_skew.signal)}/>
            <Metric l="Magnet" v={null} txt={fmt0(analysis.components.magnet.strike)} sub={analysis.components.magnet.dist_pct+'%'} sig={analysis.components.magnet.signal}/>
          </div>
          {tens&&<div className={"tension "+tens.side} title={tens.title}>{tens.label}</div>}
        </>}
      </div>
    </div>

    <OrdersPanel data={orders} onCancel={cancelOrder} onModify={modifyOrder} busy={placing}/>
    <SiteFooter cfg={cfg}/>
  </div>;
}

const leanColor=v=>v>=25?'#36d399':v<=-25?'#f87272':'#7d8b9a';
// true during US equity/index regular hours (weekday 09:30–16:00 ET), DST-aware
// via Intl. Used to pause options-data polling after the close in production.
function isMarketOpen(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  const wd=g('weekday');
  if(wd==='Sat'||wd==='Sun')return false;
  let hh=+g('hour');if(hh===24)hh=0;
  const mins=hh*60+(+g('minute'));
  return mins>=570&&mins<960;   // 09:30 … 16:00 ET
}
// short label for the closed banner from Yahoo's marketState (falls back to CLOSED).
const MKT_STATE_LABEL={REGULAR:'OPEN',PRE:'PRE-MARKET',PREPRE:'PRE-MARKET',POST:'AFTER-HOURS',POSTPOST:'AFTER-HOURS',CLOSED:'CLOSED'};
const mktLabel=c=>(c&&MKT_STATE_LABEL[c.market_state])||'CLOSED';
// Positioning is a snapshot of where premium/OI/volume cluster — NOT a price
// forecast. Label reads as call-/put-leaning, never bullish/bearish.
const LEAN_LAB={bullish:'call-leaning',bearish:'put-leaning',neutral:'balanced'};
const sigTxt=s=>s>0.05?'calls rich':s<-0.05?'puts rich':'balanced';

// ── live flow tracking (browser-only, ephemeral) ──────────────────────────────
const FLOW_WINDOW_MS=3*60*1000;     // fast tape window
const SESS_WINDOW_MS=60*60*1000;    // slow CVD horizon (trailing 60m)
const BUCKET_MS=3*60*1000;          // consistency sub-window
const abbr=n=>{n=Math.abs(Math.round(n));return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);};
// sum the $ increments newer than fromT → the fast (3m) call/put flow.
function windowFlow(incs,fromT){
  let call=0,put=0,n=0;
  for(const x of incs){if(x.t<fromT)continue;call+=x.dc;put+=x.dp;n++;}
  if(n<1)return null;
  return {call,put,net:call-put};
}
// aggregate the whole trailing-60m increment series into a cumulative-delta read.
// net $ (call−put) and directionality = |net|/gross (how one-sided the raw flow is)
// describe SIZE; but TREND-vs-CHOP is judged by PERSISTENCE — how many 3-min windows
// agree on a side. A persistent-but-mild drift (every window call, small edge) is a
// trend, not chop, so net/gross alone would mislabel it. This is also the noise
// filter: a lone opposite print can't out-vote dozens of same-side windows.
function fmtHeld(ms){const m=Math.floor(ms/60000);if(m<1)return '<1m';if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?' '+r+'m':'');}
function sessionFlow(incs){
  if(incs.length<3)return null;
  let net=0,gross=0;
  for(const x of incs){net+=x.dc-x.dp;gross+=x.dc+x.dp;}
  if(gross<=0)return null;
  const dir=Math.min(1,Math.abs(net)/gross);
  const buckets={};
  for(const x of incs){const b=Math.floor(x.t/BUCKET_MS);buckets[b]=(buckets[b]||0)+(x.dc-x.dp);}
  const bnets=Object.keys(buckets).map(k=>buckets[k]);
  const callB=bnets.filter(n=>n>0).length,putB=bnets.filter(n=>n<0).length;
  const total=bnets.length,dom=Math.max(callB,putB);
  const consistency=total?dom/total:0;                 // 1 = every window same side, .5 = split (chop)
  const side=net>0?'call':net<0?'put':'';
  // ONE coherent encoding: bar LENGTH = magnitude past the flip (dir, half-width from center),
  // bar COLOR/pulse = commitment. contested = amber pulse (near the flip line, sign not trustworthy);
  // committed = solid call/put (persistent AND clear of the flip); building = amber steady (moving, not yet persistent).
  let state,commitCls,regime,regimeCls;
  if(dir<0.10){state='contested';commitCls='contested';regime='contested';regimeCls='flat';}
  else if(consistency>=0.70&&side){state='committed';commitCls=net>0?'cCall':'cPut';regime='trending '+side;regimeCls=net>0?'conf':'div';}
  else{state='building';commitCls='building';regime='building'+(side?' '+side:'');regimeCls='flat';}
  const half=Math.round(Math.min(50,dir*50)*10)/10;    // fill half-width % from center (0..50)
  return {net,gross,dir,consistency,half,state,commitCls,agree:dom,total,regime,regimeCls,
          sideWord:net>0?'call-side':net<0?'put-side':'mixed'};
}
// classify the window's net $ flow against the static lean: same side = the lean
// is live (confirms), opposite = it's being faded (diverging). On a balanced lean
// there's nothing to confirm, so just name the side the money is hitting.
function flowState(flow,lean){
  if(!flow)return null;
  const tot=flow.call+flow.put;
  if(tot<=0)return null;
  if(Math.abs(flow.net)<0.06*tot)return {...flow,arrow:'–',word:'flat',cls:'flat'};
  const ns=flow.net>0?1:-1, ls=lean>=25?1:lean<=-25?-1:0;
  const arrow=ns>0?'▲':'▼';
  if(ls===0)return {...flow,arrow,word:(ns>0?'call':'put')+' flow',cls:ns>0?'call':'put'};
  if(ns===ls)return {...flow,arrow,word:'confirms',cls:'conf'};
  return {...flow,arrow,word:'diverging',cls:'div'};
}
// Cross-tab "stretched" read. Fires only in the specific tension config: the 60m
// session flow is TRENDING one way, but the resting book (Lean committed + skew
// rich) AND the freshest 3m flow all point the OTHER way. Prior: that tension
// tends to resolve by the hour-flow reverting TOWARD positioning (the session-bar
// side is the one likely to give) — the book rarely collapses to meet the flow, and
// the 60m residue also decays as its oldest prints age out. Descriptive state, not a
// forecast. Skew flipping to the session-bar side is the invalidation (regime change).
function tensionRead(sess,lean,skew,fst){
  if(!sess||!fst)return null;
  const sSide=sess.net>0?1:sess.net<0?-1:0;                 // session-bar (hour flow) side
  if(sSide===0||sess.consistency<0.60||sess.dir<0.15)return null;  // must be a real, persistent regime
  const bookSide=lean>=25?1:lean<=-25?-1:0;                 // Lean committed?
  if(bookSide===0||bookSide===sSide)return null;            // book must be committed OPPOSITE the hour flow
  if((skew>0.05?1:skew<-0.05?-1:0)!==bookSide)return null;  // skew must reinforce the book
  if((fst.net>0?1:fst.net<0?-1:0)!==bookSide)return null;   // and fresh 3m money already turning to the book
  const w=bookSide>0?'call':'put', s=sSide>0?'call':'put';
  return {side:w,label:'⚡ STRETCHED · '+w+' favored',
    title:'Cross-tab tension. The trailing-60m session flow is trending '+s+', but the resting book (Lean '+(lean>0?'+':'')+Math.round(lean)+' '+w+'-leaning, skew '+w+'s-rich) AND the freshest 3m flow have all turned '+w+'. Prior: this tends to resolve by the hour-flow reverting TOWARD positioning — the '+s+' session bar is the side likely to give, not the book — and the 60m residue also decays as it ages out of the window, so there is room to recover toward '+w+'. Invalidation (a real regime change): skew capitulates to '+s+'s-rich, or 3m flow swings back to '+s+'. A prior, not a promise — pressure, not a forecast.'};
}
// Counter Read: richness = |signed leg mids| / strike-width (single leg: raw mid,
// nothing to normalize against). Returns null if any needed leg mid is missing —
// caller holds its last good reading rather than show a partial number.
function _richness(legs){
  if(!legs||!legs.length||legs.some(l=>l.mid==null))return null;
  const signed=legs.reduce((s,l)=>s+((l.action||'').startsWith('buy')?1:-1)*(l.quantity||1)*l.mid,0);
  if(legs.length<2)return Math.abs(signed);
  const strikes=legs.map(l=>l.strike);
  const width=Math.max(...strikes)-Math.min(...strikes);
  return width>0?Math.abs(signed)/width:null;
}
// Display-only magnitude for a wing's mid — unsigned, matching how the net price
// card always shows abs_mid with a separate "(credit)"/"(debit)" word rather than
// a raw signed number (a bare "-5.10" in this compact caption would read as an
// error, not a credit).
function _sideMid(legs){
  return Math.abs(legs.reduce((s,l)=>s+((l.action||'').startsWith('buy')?1:-1)*(l.mid??0),0));
}
// Iron Condor/Fly: self-split (put wing vs call wing, both already in `legs`).
// Everything else: current vs `build.counter` (opposite strikes, same chain/spot —
// see COUNTER_STRATEGY on the backend). Null if strategy/response isn't ready yet.
function counterSides(strategyKey,strategies,b){
  if(!b||!b.price||!b.price.complete)return null;
  const sdef=strategies&&strategies.find(s=>s.key===strategyKey);
  if(!sdef)return null;
  if(sdef.kind==='condor'||sdef.kind==='iron_fly'){
    const legs=b.price.legs||[];
    const putLegs=legs.filter(l=>l.side==='put'), callLegs=legs.filter(l=>l.side==='call');
    if(putLegs.length<2||callLegs.length<2)return null;
    const aR=_richness(putLegs), bR=_richness(callLegs);
    if(aR==null||bR==null||(aR+bR)<=0)return null;
    return {aLabel:'Put side',aSide:'put',aMid:_sideMid(putLegs),
            bLabel:'Call side',bSide:'call',bMid:_sideMid(callLegs),aRichness:aR,bRichness:bR,
            isCredit:sdef.type==='credit'};
  }
  if(!b.counter||!b.counter.price||!b.counter.price.complete)return null;
  const cdef=strategies.find(s=>s.key===b.counter.strategy);
  if(!cdef)return null;
  const aR=_richness(b.price.legs), bR=_richness(b.counter.price.legs);
  if(aR==null||bR==null||(aR+bR)<=0)return null;
  return {aLabel:sdef.short||sdef.name,aSide:sdef.side,aMid:b.price.abs_mid,
          bLabel:cdef.short||cdef.name,bSide:cdef.side,bMid:b.counter.price.abs_mid,
          aRichness:aR,bRichness:bR,isCredit:sdef.type==='credit'};
}
// snapshot → playable structure (simple map, not a conviction engine). Balanced
// splits on the magnet: tight near-spot OI pin → iron fly, otherwise iron condor.
function recommendStrategy(a){
  if(!a)return null;
  if(a.label==='bullish')return 'bull_call';
  if(a.label==='bearish')return 'bear_put';
  const m=a.components&&a.components.magnet;
  const pinned=m&&Math.abs(m.dist_pct)<=0.75&&(m.strength||0)>=0.35;
  return pinned?'iron_fly':'iron_condor';
}

const FLOW_HELP="Flow = premium $ of NEW contracts traded on calls vs puts over the last 3 min (Δvolume × current $/contract), tracked in this tab only (cleared on refresh). It's fresh order flow — NOT a revaluation of the day's open interest by a price tick. $0 on a side = zero new contracts traded there in the window. 'confirms' = flow pushing the same way as the lean (live); 'diverging' = flow fading it (possible exhaustion).";
const POSNOTE_HELP="This is where options positioning currently sits (live), NOT advice to trade this structure. The strategy grid auto-lands once on load from this read; it does not keep flipping as the lean drifts, so your pick stays put while you build/execute. Change it any time — your choice sticks.";
