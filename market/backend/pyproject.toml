[project]
name = "edgelane-market-backend"
version = "0.1.0"
description = "EdgeLane MARKET — index 0DTE bias + strategy service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",   # FastAPI multipart form parsing (POST /contact)
    # Per-user Webull broker (signed OpenAPI SDK). It declares cryptography<42,
    # but ONLY its unused RSA private-key signer imports cryptography — our
    # app-key path uses stdlib HMAC. The Dockerfile upgrades cryptography>=43
    # after install to override this dead-weight pin (so the auth backend keeps
    # modern crypto for PyJWT). Verified: SDK + option preview + ES256 all work.
    "webull-openapi-python-sdk>=2.0",
    "defusedxml>=0.7",   # hardened XML parse for untrusted wire-RSS feeds
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
]

# The container copies both app/ and ui/ into /srv (ui/torque.html is resolved
# by filesystem path, not import), so setuptools' flat-layout auto-discovery
# sees two top-level dirs and bails. Package only `app` (+ subpackages); ui/
# stays on disk for the Torque route to read, just not as an installed package.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
