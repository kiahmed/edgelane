[project]
name = "edgelane-market-backend"
version = "0.1.0"
description = "EdgeLane MARKET — index 0DTE bias + strategy service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
