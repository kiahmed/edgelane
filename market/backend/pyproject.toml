[project]
name = "edgelane-market-backend"
version = "0.1.0"
description = "EdgeLane MARKET — index 0DTE bias + strategy service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",   # FastAPI multipart form parsing (POST /contact)
    # Per-user Webull broker (signed OpenAPI SDK). It declares cryptography<42,
    # but ONLY its unused RSA private-key signer imports cryptography — our
    # app-key path uses stdlib HMAC. The Dockerfile upgrades cryptography>=43
    # after install to override this dead-weight pin (so the auth backend keeps
    # modern crypto for PyJWT). Verified: SDK + option preview + ES256 all work.
    "webull-openapi-python-sdk>=2.0",
    "defusedxml>=0.7",   # hardened XML parse for untrusted wire-RSS feeds
    # Simmer → Facades posting pipeline: publishes ticker state-transition events
    # to Pub/Sub (app/simmer_events.py). Imported lazily and best-effort, so a
    # missing client only disables events — it never breaks the sweep.
    "google-cloud-pubsub>=2.18",
    # Level Engine container (level_engine/store.py PgStore): Postgres via a
    # least-privilege role DSN (docs/level_engine.md §5.1). Imported lazily —
    # the backend app never loads it.
    "psycopg[binary]>=3.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
]

# The container copies app/, ui/ and level_engine/ into /srv (ui/torque.html is
# resolved by filesystem path, not import), so setuptools' flat-layout
# auto-discovery sees several top-level dirs and bails. Package `app` and
# `level_engine` (+ subpackages); ui/ stays on disk for the Torque route to
# read, just not as an installed package.
[tool.setuptools.packages.find]
include = ["app*", "level_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
