<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/favicon-192.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <title>EdgeLane — Spread Optimizer</title>

  <!-- Tailwind via CDN, with the custom font tokens this JSX uses -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            num:     ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'monospace'],
            display: ['Georgia', '"Times New Roman"', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel-standalone for in-browser JSX compile -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      /* v4.7.41: dark slate-charcoal palette (Option B) — replaces parchment theme.
         Slate-blue tinted darks for the TradingView feel; emerald/amber/rose
         accents from the JSX show through cleanly. */
      background: #0f1419;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .glow-emerald { box-shadow: 0 0 60px -10px rgba(16, 185, 129, 0.30); }
    .glow-rose    { box-shadow: 0 0 60px -10px rgba(244,  63,  94, 0.30); }
    .glow-amber   { box-shadow: 0 0 60px -10px rgba(245, 158,  11, 0.30); }
    .skeleton {
      background: linear-gradient(90deg, #1a1a24 0%, #252535 50%, #1a1a24 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    /* Loading splash — hidden once Babel mounts the app */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #57534e; font-family: ui-monospace, monospace; font-size: 0.875rem;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    #root:not(:empty) ~ #boot-splash { display: none; }

t; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-splash">◌ Compiling JSX in browser...</div>

  <script>
    // ------------------------------------------------------------
    // Keys injected at build time by edge_lane_build.sh from
    // edge_lane_config.config. These live in the bundle — fine for
    // personal/local use, NOT for any public deploy. For public deploy,
    // put a thin proxy in front and read keys server-side.
    // ------------------------------------------------------------
    window.ATLAS_KEY     = '__ATLAS_KEY__';
    window.DATA_PROVIDER = '__DATA_PROVIDER__';
    window.TRADIER_TOKEN = '__TRADIER_TOKEN__';
    window.TRADIER_BASE_URL = '__TRADIER_BASE_URL__';
    window.ANTHROPIC_KEY = '__ANTHROPIC_KEY__';
    window.GEMINI_API_KEY = '__GEMINI_API_KEY__';
    window.GEMINI_MODEL   = '__GEMINI_MODEL__';
    // Optional: route through a CORS-enabled proxy. Empty string = direct.
    window.ATLAS_BASE_URL  = '__ATLAS_BASE_URL__' || undefined;
    window.GEMINI_BASE_URL = '__GEMINI_BASE_URL__' || undefined;
    window.BIAS_NARRATIVE_OPEN_DEFAULT = '__BIAS_NARRATIVE_OPEN_DEFAULT__' === '1';
  </script>

  <script type="text/babel" data-presets="env,react">
    // React hooks pulled from the global UMD bundle (CDN)
    const { useState, useEffect, useMemo, useCallback } = React;

__JSX_BODY__

    // Mount
    ReactDOM.createRoot(document.getElementById('root')).render(<SpreadOptimizer />);
  </script>

  <!-- ============================================================== -->
  <!-- Palette overrides — placed at end of <body> so they parse AFTER -->
  <!-- Tailwind CDN's runtime-injected styles, winning the cascade.   -->
  <!-- !important still set as belt-and-suspenders.                   -->
  <!-- ============================================================== -->
  <style id="brand-palette">
    /* v4.7.41 — dark slate palette (Option B). Replaces the previous parchment
       overrides. The JSX itself was designed for dark surfaces, so we mostly
       SHIFT its stone-tinted neutrals to slate-tinted neutrals (cooler blue
       cast). User-tuned label contrast: stone-500/400 bumped one stop brighter
       so secondary captions like "Balanced · Iron Condor" and the small caps
       row (CREDIT / POP / EV / COMPOSITE) read clearly without shouting. */

    /* Page bg: JSX root uses bg-[#0a0a0f] — flip to slate */
    .bg-\[\#0a0a0f\] { background-color: #0f1419 !important; }

    /* Card bg: JSX cards use bg-[#13131c] — flip to slate-blue */
    .bg-\[\#13131c\] { background-color: #1a1f2e !important; border-color: #1e293b !important; }

    /* Stone text ramp → slate ramp (cooler). User bumped 500/400 brighter. */
    .text-stone-50  { --tw-text-opacity: 1 !important; color: #f8fafc !important; }
    .text-stone-100 { --tw-text-opacity: 1 !important; color: #f1f5f9 !important; }
    .text-stone-200 { --tw-text-opacity: 1 !important; color: #e2e8f0 !important; }
    .text-stone-300 { --tw-text-opacity: 1 !important; color: #cbd5e1 !important; }
    .text-stone-400 { --tw-text-opacity: 1 !important; color: #cbd5e1 !important; }  /* bumped — was slate-400 */
    .text-stone-500 { --tw-text-opacity: 1 !important; color: #94a3b8 !important; }  /* bumped — was slate-500 */
    .text-stone-600 { --tw-text-opacity: 1 !important; color: #64748b !important; }
    .text-stone-700 { --tw-text-opacity: 1 !important; color: #475569 !important; }

    /* Stone borders → slate borders */
    .border-stone-700,
    .border-stone-700\/60 { border-color: #334155 !important; }
    .border-stone-800\/40,
    .border-stone-800\/60,
    .border-stone-800\/80 { border-color: #1e293b !important; }

    /* Stone bg fills → slate */
    .bg-stone-900       { background-color: #0f1419 !important; }
    .bg-stone-900\/40  { background-color: rgba(15, 20, 25, 0.4) !important; }
    .bg-stone-900\/60  { background-color: rgba(15, 20, 25, 0.6) !important; }
    .bg-stone-800\/40  { background-color: rgba(26, 31, 46, 0.4) !important; }
    .bg-stone-800\/50  { background-color: rgba(26, 31, 46, 0.5) !important; }
    .bg-stone-800\/60  { background-color: rgba(26, 31, 46, 0.6) !important; }

    /* Accent text — restore the original Tailwind ramp values that work on dark */
    .text-emerald-400 { --tw-text-opacity: 1 !important; color: #34d399 !important; }
    .text-emerald-300 { --tw-text-opacity: 1 !important; color: #6ee7b7 !important; }
    .text-emerald-200 { --tw-text-opacity: 1 !important; color: #a7f3d0 !important; }
    .text-amber-400   { --tw-text-opacity: 1 !important; color: #fbbf24 !important; }
    .text-amber-300   { --tw-text-opacity: 1 !important; color: #fcd34d !important; }
    .text-amber-200   { --tw-text-opacity: 1 !important; color: #fde68a !important; }
    .text-rose-400    { --tw-text-opacity: 1 !important; color: #fb7185 !important; }
    .text-rose-300    { --tw-text-opacity: 1 !important; color: #fda4af !important; }
    .text-rose-200    { --tw-text-opacity: 1 !important; color: #fecdd3 !important; }

    /* v4.7.41: native HTML <input type="date"> integrates poorly on dark
       bgs — the calendar picker icon defaults to near-black on near-black.
       color-scheme:dark switches the entire native widget to the browser's
       dark theme. The WebKit indicator filter brightens the icon explicitly
       on Chrome/Safari/Edge. Firefox already respects color-scheme. */
    input[type="date"] {
      color-scheme: dark;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85) brightness(1.6);
      opacity: 0.85;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: opacity 120ms;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
      background-color: rgba(52, 211, 153, 0.15);
    }

    /* font-bold normally renders heavy — keep the existing 500 weight */
    .font-bold { font-weight: 500 !important; }
  </style>
</body>
</html>
