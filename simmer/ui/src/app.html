<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>EdgeLane Simmer — Premium-Selling Readiness</title>
		<meta name="description" content="Refusal-first premium-selling readiness engine. Most days the right trade is no trade." />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/assets/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/assets/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/assets/favicon-16.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/assets/favicon-192.png" />
		<link rel="shortcut icon" href="%sveltekit.assets%/assets/favicon.ico" />
		<!-- Runtime config (window.__EDGELANE_*__ globals). Served with
		     Cache-Control: no-store (vercel.json) and overwritten at deploy by
		     deploy.sh stage_simmer() — the same pattern as Matrix. Loaded
		     synchronously BEFORE the app bundle so config.ts always sees it. -->
		<script src="%sveltekit.assets%/edgelane.config.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="text-slate-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
